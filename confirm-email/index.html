<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostatni krok - Ketobook</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 700px; /* Zwiększona szerokość, żeby tekst lepiej się rozkładał */
            padding: 40px 20px;
        }
        h1 {
            font-size: 32px; /* Nieco większy, bardziej proporcjonalny nagłówek */
            font-weight: 600;
            color: #000000; /* 100% czarny */
            margin-bottom: 24px;
        }
        p {
            font-size: 16px; /* Komfortowy rozmiar czcionki */
            line-height: 1.7;
            color: #676a6c; /* Pozostawiony delikatniejszy odcień */
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ostatni krok! 📨</h1>
        <p>Wiadomość potwierdzająca została wysłana. Zajrzyj do swojej skrzynki, potwierdzź zapis na listę oczekujących i odbierz darmowy bonus.</p>
    </div>
</body>
</html>
